<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM de Vendas Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: sidebar fixa + topbar + área de conteúdo em grid de cards (padrão do dashboard de referência) */
:root{
  --bg:#f6f8fb; --card:#ffffff; --line:#e4e8ef; --text:#0f172a; --muted:#64748b; --soft:#f1f5f9;
  --blue:#2563eb; --blue-soft:#eaf1ff; --green:#16a34a; --green-soft:#e9f8ef; --amber:#d97706; --amber-soft:#fff6e5;
  --red:#dc2626; --red-soft:#fdeeee; --violet:#7c3aed; --violet-soft:#f2ecff; --wa:#16a34a;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --card:#121a2c; --line:#24304a; --text:#e6ebf5; --muted:#93a0b8; --soft:#18223a;
  --blue:#5b8cff; --blue-soft:#1b2a4d; --green:#34c26b; --green-soft:#12301f; --amber:#f0a332; --amber-soft:#33260f;
  --red:#f26363; --red-soft:#3a1717; --violet:#a684ff; --violet-soft:#261c45; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1020; --card:#121a2c; --line:#24304a; --text:#e6ebf5; --muted:#93a0b8; --soft:#18223a;
  --blue:#5b8cff; --blue-soft:#1b2a4d; --green:#34c26b; --green-soft:#12301f; --amber:#f0a332; --amber-soft:#33260f;
  --red:#f26363; --red-soft:#3a1717; --violet:#a684ff; --violet-soft:#261c45; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;font-weight:700;font-size:17px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff}
.nav{flex:1;overflow:auto;padding:4px 10px 12px}
.nav h6{margin:16px 8px 6px;font-size:10.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--soft)}
.nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.nav a .cnt.b{background:var(--blue)}
.nav svg{width:16px;height:16px}
.me{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.main{min-width:0}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.crumb{color:var(--muted);font-size:13.5px}.crumb b{color:var(--text);font-weight:500}
.top .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:260px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;position:relative}
.iconbtn:hover{background:var(--soft)}
.iconbtn.p{background:var(--blue);color:#fff}
.dot{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:9px;border-radius:8px;padding:0 4px;font-weight:700}
.demo{background:var(--blue-soft);color:var(--blue);text-align:center;font-size:12px;padding:6px}
.content{padding:24px;max-width:1500px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:24px;margin:0;font-weight:700;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph .sp{flex:1}
.sel,.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn svg{width:14px;height:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px}
.seg button.on{background:var(--blue);color:#fff}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative}
.kpi small{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi i,.kpi svg.ic{position:absolute;top:12px;right:12px;width:15px;height:15px}
.up{color:var(--green)}.dn{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 a{font-size:12px;color:var(--blue);text-decoration:none;font-weight:500;cursor:pointer}
.card h3 svg{width:16px;height:16px}
.note{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:10px}
.note b{color:var(--text)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.pill.b{background:var(--blue-soft);color:var(--blue)}.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.r{background:var(--red-soft);color:var(--red)}
.pill.v{background:var(--violet-soft);color:var(--violet)}.pill.n{background:var(--soft);color:var(--muted)}
.pill svg{width:11px;height:11px}
.muted{color:var(--muted)}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:210px}
.row{display:flex;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.li{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.li.warn{background:var(--red-soft);border-color:transparent}
.li .t{font-weight:600;font-size:13px}.li .d{font-size:11.5px;color:var(--muted)}
.li .r{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.stagebar{margin-bottom:10px}
.stagebar .row{justify-content:space-between;font-size:12.5px}
.track{height:14px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.track span{display:block;height:100%;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:10px;padding:10px;min-height:420px}
.col.over{outline:2px dashed var(--blue)}
.colh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;padding:2px 4px}
.colh b{font-size:13px}.colh span{font-size:11.5px;color:var(--muted)}
.colh .bar{height:3px;border-radius:2px;margin:6px 4px 10px}
.deal{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;cursor:grab}
.deal:hover{border-color:var(--blue)}
.deal .t{font-weight:600;font-size:13px}
.deal .c{font-size:12px;color:var(--muted);margin:2px 0 8px}
.deal .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.deal .val{font-weight:700;margin-right:auto}
.next{font-size:11.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:center;color:var(--muted)}
.next svg{width:12px;height:12px}
/* Email */
.mail{display:grid;grid-template-columns:210px 380px 1fr;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:640px;overflow:hidden}
.mail .fold{border-right:1px solid var(--line);padding:12px}
.mail .fold button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-size:13px}
.mail .fold button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.mail .fold button span{margin-left:auto;font-size:11.5px;color:var(--muted)}
.mail .fold svg{width:15px;height:15px}
.mlist{border-right:1px solid var(--line);overflow:auto;max-height:720px}
.mi{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mi:hover{background:var(--soft)}
.mi.on{background:var(--blue-soft)}
.mi.auto{opacity:.6}
.mi .h{display:flex;gap:8px;align-items:baseline}
.mi .h b{font-size:13px}.mi .h span{margin-left:auto;font-size:11px;color:var(--muted)}
.mi .s{font-size:12.5px;font-weight:500;margin:2px 0}
.mi .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mread{padding:20px;overflow:auto;max-height:720px}
.mread h2{font-size:18px;margin:0 0 6px}
.mbody{font-size:13.5px;line-height:1.65;white-space:pre-line;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:14px 0}
.ai{border:1px solid var(--violet-soft);background:linear-gradient(0deg,var(--violet-soft),var(--violet-soft));border-radius:10px;padding:12px 14px;font-size:13px}
.ai h4{margin:0 0 6px;font-size:12.5px;color:var(--violet);display:flex;gap:6px;align-items:center}
.ai h4 svg{width:14px;height:14px}
.ai ul{margin:4px 0 0;padding-left:18px}
.rules{font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);margin-top:10px}
/* Agenda */
.day{display:grid;grid-template-columns:56px 1fr;position:relative}
.hr{height:58px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding-top:2px}
.slots{position:relative}
.ev{position:absolute;left:8px;right:8px;border-radius:8px;padding:6px 10px;font-size:12px;border-left:3px solid;cursor:pointer;overflow:hidden}
.ev b{display:block;font-size:12.5px}
.ev.on{box-shadow:0 0 0 2px var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;padding:4px}
.cd{border:1px solid var(--line);border-radius:9px;min-height:96px;padding:7px;font-size:11.5px;display:flex;flex-direction:column;gap:3px;background:var(--card)}
.cd.out{opacity:.35}
.cd.today{outline:2px solid var(--blue)}
.cd .n{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between}
.cd .fc{border-radius:5px;padding:2px 5px;font-weight:600;font-variant-numeric:tabular-nums}
.cd .mt{color:var(--muted)}
.heat{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.heat span{width:18px;height:10px;border-radius:3px;display:inline-block}
/* Conversas */
.conv{display:grid;grid-template-columns:260px 1fr 360px;gap:16px}
.cl{display:flex;flex-direction:column;gap:8px}
.cv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);cursor:pointer}
.cv.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.cv .t{font-weight:600;font-size:13px}.cv .d{font-size:11.5px;color:var(--muted)}
.att{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:9px;padding:10px;margin-bottom:12px;font-size:12.5px}
.att .w{flex:1;height:26px;background:repeating-linear-gradient(90deg,var(--blue) 0 2px,transparent 2px 5px);opacity:.35;border-radius:3px}
.tr{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto;padding-right:6px}
.tl{display:grid;grid-template-columns:44px 1fr;gap:8px;font-size:13px}
.tl time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tl b{font-size:12px}
.tl mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 2px}
.gauge{display:flex;flex-direction:column;align-items:center}
.thermo{height:12px;border-radius:6px;background:linear-gradient(90deg,#60a5fa,#facc15,#f97316,#dc2626);position:relative;margin:10px 0 4px}
.thermo i{position:absolute;top:-5px;width:4px;height:22px;background:var(--text);border-radius:2px}
.thl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.fac{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;font-size:12.5px;margin:6px 0}
.fac .track{height:7px;margin:0}
.cad{position:relative;padding-left:18px}
.cad:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.cs{position:relative;margin-bottom:12px;font-size:12.5px}
.cs:before{content:"";position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--blue)}
.cs b{display:block}
.worth{border-radius:10px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.worth .big{font-size:26px;font-weight:700}
/* Follow-up */
.fu{display:grid;grid-template-columns:1fr 440px;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 11px;font-size:12px}
.chip:hover,.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--card);resize:vertical;min-height:150px;font-size:13px;line-height:1.55}
input[type=text],input[type=number],input[type=password]{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);width:100%}
.prio{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.wa-preview{background:#e7ddd3;border-radius:10px;padding:14px;margin-top:10px}
:root[data-theme="dark"] .wa-preview{background:#1d2a25}
.bubble{background:#dcf8c6;color:#111;border-radius:8px 0 8px 8px;padding:8px 10px;font-size:13px;white-space:pre-line;margin-left:auto;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.1)}
/* Metas */
.goalin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.goalin .big{font-size:28px;font-weight:700;width:200px;border:2px solid var(--blue);border-radius:10px;padding:6px 12px;background:var(--card)}
.funnelrev{display:flex;flex-direction:column;gap:6px;align-items:center}
.fr{border-radius:8px;color:#fff;text-align:center;padding:10px;font-weight:600;font-size:13px}
.fr small{display:block;font-weight:400;opacity:.9;font-size:11.5px}
.sl{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:12.5px;margin:8px 0}
input[type=range]{width:100%;accent-color:var(--blue)}
.prog{height:16px;border-radius:8px;background:var(--soft);overflow:hidden;position:relative}
.prog span{display:block;height:100%;background:var(--green)}
.formula{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--soft);border-radius:8px;padding:10px;margin-top:8px}
/* Integrações */
.ints{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.int{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.int .hd{display:flex;gap:10px;align-items:center}
.lg{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.int .hd b{font-size:14px}.int .hd small{display:block;color:var(--muted);font-size:11.5px}
.int p{margin:0;font-size:12.5px;color:var(--muted)}
.int .ft{display:flex;gap:6px;align-items:center;margin-top:auto;font-size:11.5px;color:var(--muted)}
.int .ft .btn{margin-left:auto}
.feat{border:2px solid var(--blue);background:linear-gradient(180deg,var(--blue-soft),var(--card) 60%)}
.subs{display:flex;flex-wrap:wrap;gap:5px}
/* Atividades */
.tlx{position:relative;padding-left:26px}
.tlx:before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line)}
.ti{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.ti .ic{position:absolute;left:-26px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg)}
.ti .ic svg{width:12px;height:12px}
.ti .t{font-size:13px;font-weight:600}.ti .d{font-size:12px;color:var(--muted)}
.ti .w{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right}
.dayh{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px -26px}
/* Chat IA */
.chat{border-top:1px solid var(--line);margin:12px -18px -18px;padding:16px 18px}
.msgs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:10px;font-size:13px;white-space:pre-line}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff}
.msg.a{align-self:flex-start;background:var(--soft)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;z-index:40;padding:16px}
.modal.show{display:grid}
.modal .box{background:var(--card);border-radius:14px;padding:20px;width:min(480px,100%);border:1px solid var(--line)}
.modal label{font-size:12px;font-weight:600;display:block;margin:12px 0 4px}
.menu-btn{display:none}
@media (max-width:1200px){.conv{grid-template-columns:220px 1fr}.conv>.side{grid-column:1/-1}.mail{grid-template-columns:180px 1fr}.mail .mread{grid-column:1/-1;border-top:1px solid var(--line)}}
@media (max-width:980px){
  .app{grid-template-columns:1fr} aside{position:fixed;left:-240px;width:232px;z-index:30;transition:.2s} aside.open{left:0}

let G={meta:8000,r1:30,r2:60,r3:35,tk:6500};let gPick=null;
function pMetas(){
 const ws=sum(won(),d=>d.v);
 return `<div class="ph"><div><h1>Metas</h1><p>Defina quanto quer faturar a mais e veja quais contatos e quantos leads levam até lá</p></div></div>
 <div class="card" style="margin-bottom:16px"><div class="goalin"><span style="font-weight:600">Quero faturar a mais</span><label class="sr" for="gmeta" style="display:none">Meta</label>
  <span style="font-size:20px;font-weight:700">+R$</span><input class="big" type="number" id="gmeta" value="${G.meta}" step="500" oninput="G.meta=+this.value||0;gPick=null;upd()">
  <span class="muted">até 30/11</span><span style="flex:1"></span>${[8000,15000,25000,40000].map(v=>`<button class="chip ${G.meta===v?'on':''}" onclick="G.meta=${v};gPick=null;render()">+${fmtk(v)}</button>`).join('')}</div></div>
 <div id="gout"></div>
 <div class="card" style="margin-top:16px"><h3>Progresso da meta mensal (${fmt(META_MES)})</h3><div class="prog"><span style="width:${ws/META_MES*100}%"></span></div><div class="row muted" style="font-size:12px;margin-top:6px"><span>Ganho ${fmt(ws)}</span><span style="margin-left:auto">Faltam ${fmt(META_MES-ws)}</span></div></div>`;
}
function upd(){
 const el=document.getElementById('gout');if(!el)return;
 const cand=[...open()].sort((a,b)=>b.v*b.pr-a.v*a.pr);
 if(!gPick){gPick=new Set();let acc=0;for(const d of cand){if(acc>=G.meta)break;gPick.add(d.id);acc+=d.v*d.pr/100}}
 const picked=cand.filter(d=>gPick.has(d.id)),pond=sum(picked,d=>d.v*d.pr/100),bruto=sum(picked,d=>d.v);
 const gap=Math.max(0,G.meta-pond);
 const deals=Math.ceil(G.meta/G.tk),props=Math.ceil(deals/(G.r3/100)),reun=Math.ceil(props/(G.r2/100)),leads=Math.ceil(reun/(G.r1/100));
 const gapLeads=Math.ceil(Math.ceil(gap/G.tk)/(G.r3/100)/(G.r2/100)/(G.r1/100));
 el.innerHTML=`<div class="grid g2"><div class="card"><h3><i data-lucide="users"></i>Contatos que levam a +${fmt(G.meta)}<span class="sp"></span><span class="pill ${pond>=G.meta?'g':'a'}">${pond>=G.meta?'meta coberta':'faltam '+fmt(gap)}</span></h3>
  <div class="note" style="margin:0 0 12px">A IA escolhe os negócios com maior <b>valor esperado</b> (valor × probabilidade) até cobrir a meta. Marque ou desmarque para simular.</div>
  <div class="list">${cand.map(d=>{const on=gPick.has(d.id);return `<label class="li" style="cursor:pointer;${on?'border-color:var(--green);background:var(--green-soft)':''}"><input type="checkbox" ${on?'checked':''} onchange="tog(${d.id})"><div><div class="t">${d.p} · ${d.e}</div><div class="d">${d.s} · ${d.pr}% · ${d.nx}</div></div><div class="r">${fmt(d.v*d.pr/100)}<div class="muted" style="font-size:11px;font-weight:400">de ${fmt(d.v)}</div></div></label>`}).join('')}</div>
  <div class="note"><b>${picked.length} contatos</b> · ${fmt(bruto)} brutos · <b>${fmt(pond)} ponderados</b>${gap>0?` · precisa de mais <b>${gapLeads} leads novos</b> para cobrir a diferença`:''}</div></div>
 <div class="grid" style="align-content:start"><div class="card"><h3><i data-lucide="filter"></i>Funil reverso para +${fmt(G.meta)} só com leads novos</h3>
  <div class="funnelrev">${[[leads,'leads','#1a73e8',100],[reun,'reuniões','#12b5cb',82],[props,'propostas','#a142f4',64],[deals,'contratos','#1e8e3e',46]].map(r=>`<div class="fr" style="background:${r[2]};width:${r[3]}%">${r[0]} ${r[1]}</div>`).join('')}</div>
  <div style="margin-top:14px">${[['r1','Lead → reunião',5,70],['r2','Reunião → proposta',10,95],['r3','Proposta → contrato',5,80]].map(s=>`<div class="sl"><label for="${s[0]}">${s[1]}</label><input type="range" id="${s[0]}" min="${s[2]}" max="${s[3]}" value="${G[s[0]]}" oninput="G.${s[0]}=+this.value;upd()"><b class="num">${G[s[0]]}%</b></div>`).join('')}
  <div class="sl"><label for="gtk">Ticket médio</label><input type="range" id="gtk" min="2000" max="25000" step="500" value="${G.tk}" oninput="G.tk=+this.value;upd()"><b class="num">${fmtk(G.tk)}</b></div></div></div>
  <div class="card"><h3><i data-lucide="calendar-range"></i>Ritmo semanal até 30/11</h3><table><tbody>
   <tr><td>Leads novos por semana</td><td class="num"><b>${Math.ceil(gapLeads/2)||0}</b></td></tr><tr><td>Reuniões por semana</td><td class="num"><b>${Math.ceil(gap/G.tk/(G.r3/100)/(G.r2/100)/2)||0}</b></td></tr>
   <tr><td>Follow-ups nos contatos marcados</td><td class="num"><b>${picked.length*3}</b></td></tr><tr><td>Investimento em tráfego sugerido (CPL R$ 38)</td><td class="num"><b>${fmt(gapLeads*38)}</b></td></tr></tbody></table>
  <button class="btn pri" style="margin-top:12px" onclick="go('followup')"><i data-lucide="send"></i>Iniciar follow-ups dos ${picked.length} contatos</button></div></div></div>`;
 icons();
}
function tog(id){gPick.has(id)?gPick.delete(id):gPick.add(id);upd()}

function cfg(id){
 if(id==='google'){const on=ISTATE.google&&ISTATE.google.st==='on';
  return modal(`<h3 style="margin:0 0 4px">Conector Google</h3><div class="muted" style="font-size:12.5px">Um login libera todos os serviços do Google Workspace.</div>
  <label>Permissões solicitadas</label><div class="subs">${INTS.filter(i=>i.google).map(i=>`<span class="pill b" title="${i.scopes}">${i.n}</span>`).join('')}</div>

  <label>Como configurar</label><ol style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.6"><li>console.cloud.google.com: crie um projeto e ative Gmail, Calendar, Drive, Meet, People e Sheets</li><li>Tela de consentimento OAuth do tipo <b>Interno</b> (sem auditoria do Google)</li><li>Crie a credencial OAuth "Aplicativo da Web" com a URL de retorno abaixo</li></ol>
  <label for="gcb">URL de retorno</label><div class="row"><input type="text" id="gcb" readonly value="https://crm-vendas-pam.vercel.app/oauth/google"><button class="btn sm" onclick="cpv('gcb')"><i data-lucide="copy"></i></button></div>
  <div class="row" style="margin-top:18px;justify-content:flex-end">${on?`<button class="btn" style="color:var(--red);margin-right:auto" onclick="disc('google')">Desconectar</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="conn('google')">${on?'Salvar':'Conectar com Google'}</button></div>`)}
 const i=INTS.find(x=>x.id===id),s=ist(i),hook=`https://crm-vendas-pam.vercel.app/api/hooks/${id}`;
 if(i.google)return modal(`<h3 style="margin:0 0 4px">${i.n}</h3><div class="muted" style="font-size:12.5px">${i.d}</div><label>Permissão (escopo)</label><div class="formula">${i.scopes}</div><div class="note">Este serviço usa o login do Conector Google.</div>
  <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" onclick="closeModal()">Fechar</button>${ISTATE.google&&ISTATE.google.st==='on'?`<button class="btn pri" onclick="tgl('${id}')">${s==='on'?'Desligar este serviço':'Ligar este serviço'}</button>`:`<button class="btn pri" onclick="cfg('google')">Abrir Conector Google</button>`}</div>`);
 modal(`<div class="row"><span class="lg" style="background:${i.c};width:34px;height:34px;font-size:12px">${i.l}</span><div><h3 style="margin:0">${i.n}</h3><div class="muted" style="font-size:12px">Usado em: ${i.use}</div></div><span style="margin-left:auto">${stPill(s)}</span></div>
 ${i.mode?`<label>Ambiente</label><div class="seg" id="imode">${i.mode.map((m,k)=>`<button type="button" class="${(s==='on'?'live':'test')===m[0]?'on':''}" data-m="${m[0]}" onclick="[...this.parentNode.children].forEach(b=>b.classList.remove('on'));this.classList.add('on')">${m[1]}</button>`).join('')}</div>`:''}
 ${i.f.map(f=>`<label for="if_${f[0]}">${f[1]}</label>${f[2]==='secret'&&f[1].includes('JSON')?`<textarea id="if_${f[0]}" style="min-height:70px" placeholder='${f[3]}'></textarea>`:`<input type="${f[2]==='secret'?'password':'text'}" id="if_${f[0]}" placeholder="${f[3]}" ${f[0]==='redir'?`value="${f[3]}" readonly`:''}>`}`).join('')}
 ${i.hook?`<label for="ihook">Webhook para cadastrar no ${i.n}</label><div class="row"><input type="text" id="ihook" readonly value="${hook}"><button class="btn sm" onclick="cpv('ihook')"><i data-lucide="copy"></i></button></div>`:''}
 <details style="margin-top:14px"><summary>Como obter as credenciais</summary><ol style="margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6">${i.how.map(h=>`<li>${h}</li>`).join('')}</ol></details>
 <div id="ires" style="font-size:12.5px;margin-top:10px;min-height:18px"></div>
 <div class="row" style="margin-top:12px;justify-content:flex-end;flex-wrap:wrap">${s!=='off'?`<button class="btn" style="color:var(--red);margin-right:auto" onclick="disc('${id}')">Desconectar</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn" onclick="testI('${id}')"><i data-lucide="plug-zap"></i>Testar</button><button class="btn pri" onclick="conn('${id}')">${i.oauth&&s==='off'?'Conectar e autorizar':'Salvar'}</button></div>`);
}
function cpv(id){const v=document.getElementById(id).value;navigator.clipboard?.writeText(v).then(()=>toast('Copiado'),()=>toast('Selecione e copie'))}
function missing(id){const i=INTS.find(x=>x.id===id);if(!i||!i.f)return[];return i.f.filter(f=>!/opcional|alternativa/.test(f[1]+f[3])&&f[0]!=='redir').filter(f=>{const el=document.getElementById('if_'+f[0]);return el&&!el.value.trim()}).map(f=>f[1])}
function testI(id){const m=missing(id),r=document.getElementById('ires');if(m.length){r.style.color='var(--red)';r.textContent='Preencha: '+m.join(', ');return}r.style.color='var(--muted)';r.textContent='Testando conexão…';setTimeout(()=>{r.style.color='var(--green)';r.textContent='Campos válidos. O teste real acontece pelo servidor na versão com Supabase.'},700)}
function conn(id){
 if(id!=='google'){const m=missing(id),r=document.getElementById('ires');if(m.length&&!(ISTATE[id]&&ISTATE[id].st!=='off')){r.style.color='var(--red)';r.textContent='Preencha: '+m.join(', ');return}}
 const md=document.querySelector('#imode .on');const st=md&&md.dataset.m==='test'?'test':'on';
 ISTATE[id]={st,at:'conectado agora'};saveI();closeModal();render();toast((id==='google'?'Conector Google':INTS.find(x=>x.id===id).n)+(st==='test'?' em modo de teste':' conectado')+' (demo)')}
function disc(id){ISTATE[id]={st:'off'};saveI();closeModal();render();toast('Desconectado')}
function tgl(id){const s=ist(INTS.find(x=>x.id===id));ISTATE[id]={st:s==='on'?'off':'on'};saveI();closeModal();render()}

 const c=cur();charts.forEach(x=>x.destroy());charts=[];chartDefaults();
 document.getElementById('nav').innerHTML=navHTML(c);
 document.getElementById('crumb').textContent=PAGES.find(p=>p[0]===c)[1];
 const sy=window.scrollY;document.getElementById('view').innerHTML=R[c][0]();
 if(R[c][1])R[c][1]();icons();
 if(render._last===c)window.scrollTo(0,sy);else window.scrollTo(0,0);render._last=c;
 document.getElementById('side').classList.remove('open');
}
window.addEventListener('hashchange',render);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter'){pView='lista';go('pipeline');toast('Busca: '+e.target.value)}});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',render);

render();
